<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#04080a;--edge:rgb(115,230,204);--gold:#ffc766;--text:#cfe9e4;--dim:#7f9b96;--head:"Chakra Petch",system-ui,sans-serif;--body:Inter,system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.65 var(--body);overflow:hidden}
#under{position:fixed;inset:0;z-index:0;background:radial-gradient(120% 90% at 50% 20%,#0b1a1c,#04080a)}
#c{position:fixed;inset:0;z-index:1;width:100%;height:100%;pointer-events:none}
#brand{position:fixed;z-index:6;top:0;left:0;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 0;pointer-events:none;text-shadow:0 1px 12px #000}
#name{font:700 20px var(--head);letter-spacing:.08em;color:#e6fffa}#tag{font-size:13px;color:var(--dim)}
#back{position:fixed;z-index:7;display:none;top:calc(14px + env(safe-area-inset-top,0px));right:16px;padding:8px;border:0;background:none;cursor:pointer;color:#e6fffa;font:700 15px var(--head);letter-spacing:.08em;text-shadow:0 1px 12px #000}
#back.on{display:block}#back:hover,#back:focus-visible{outline:none;color:var(--gold)}
.pk{position:fixed;z-index:7;display:none;border:0;padding:0;cursor:pointer;color:#e6fffa;font:700 13px var(--head);letter-spacing:.06em;text-shadow:0 1px 10px #000;
 background:linear-gradient(rgba(4,8,10,.5),rgba(4,8,10,.5)),var(--th,linear-gradient(#14403f,#071416)) center/cover;transition:filter .3s}
.pk.on{display:flex;align-items:center;justify-content:center}.pk:hover,.pk:focus-visible{outline:none;filter:brightness(1.35)}
#prev,#next{bottom:0;width:50%;height:calc(66px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
#prev{left:0;clip-path:polygon(0 14px,60% 0,calc(100% - 6px) 16px,calc(100% - 14px) 100%,0 100%)}
#next{right:0;clip-path:polygon(14px 16px,40% 0,100% 12px,100% 100%,0 100%)}
@media (min-aspect-ratio:1/1){#prev,#next{top:0;bottom:0;width:clamp(48px,6vw,96px);height:auto;padding:0}.pk span{writing-mode:vertical-rl}
 #prev{clip-path:polygon(0 0,calc(100% - 14px) 0,100% 35%,calc(100% - 8px) 62%,calc(100% - 14px) 100%,0 100%)}
 #next{clip-path:polygon(14px 0,100% 0,100% 100%,8px 100%,0 62%,14px 35%)}
 #stage.page{padding-inline:clamp(48px,6vw,96px)}}
#stage{position:fixed;inset:0;z-index:5;overflow-x:hidden;display:grid;place-items:center;touch-action:none}
#stage.out{opacity:0;pointer-events:none}
#stage.page{display:block;overflow-y:auto;touch-action:pan-y}
#menu{position:absolute;inset:0}
#tiles{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.tile{position:absolute;width:0;height:0;will-change:transform,opacity}.tp{position:absolute;overflow:hidden;contain:strict}.snap{position:absolute;transform:translateZ(0);overflow:hidden;contain:strict}
/* clones only: brightness(.8) is the same as a 20% black overlay, without an extra filter surface per panel per tile */
.snap .bg{filter:none}.snap .bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.2)}
body.asm>#stage,body.asm>.pk,body.asm>#back,body.asm>#brand{opacity:0!important}
.it{position:absolute;inset:0;padding:0;border:0;background:none;cursor:pointer;color:inherit;font:inherit;overflow:hidden}
.bg{position:absolute;inset:-2%;background:linear-gradient(rgba(4,8,10,.3),rgba(4,8,10,.55)),var(--th,linear-gradient(135deg,#14403f,#071416)) center/cover;filter:brightness(.8);transition:transform .7s cubic-bezier(.2,.9,.2,1),filter .4s}
.it:hover .bg,.it:focus-visible .bg{transform:scale(1.05);filter:brightness(1.05)}.it:focus-visible{outline:none}
.tx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.tx b{font:700 clamp(22px,4.2vw,44px) var(--head);letter-spacing:.06em;color:#f2fffc;text-shadow:0 2px 20px #000}
.tx i{font:500 13px var(--body);color:var(--gold);font-style:normal;text-shadow:0 1px 8px #000}
#empty{display:none;text-align:center;color:var(--dim);padding:30px}
.wrap{max-width:720px;min-height:calc(100% - 34vh);margin:34vh auto 0;padding:64px 22px 110px;background:rgba(4,8,10,.9);clip-path:polygon(0 34px,20% 0,46% 22px,74% 6px,100% 38px,100% 100%,0 100%)}
#stage.page{background:linear-gradient(rgba(4,8,10,.1),rgba(4,8,10,.5)),var(--art,radial-gradient(120% 90% at 50% 20%,#14403f,#04080a)) center/cover}
.wrap h1,.wrap h2,.wrap h3{font-family:var(--head);color:#e6fffa;line-height:1.15}
.wrap h1{font-size:clamp(30px,7vw,48px);margin:0 0 .4em}.wrap h2{font-size:22px;color:var(--edge);margin:1.8em 0 .5em}
.wrap a{color:var(--edge)}.wrap a:hover{color:var(--gold)}
.wrap img,.wrap iframe{display:block;width:100%;max-width:100%;border:1px solid rgba(255,255,255,.18);margin:1em 0}
.wrap iframe{aspect-ratio:16/9;border:0;background:#000}
.wrap pre{border:1px solid rgba(255,255,255,.15);padding:14px;overflow:auto}.wrap code{font-size:.9em;color:var(--gold)}
.wrap a.btn{display:inline-block;margin:.3em .5em .3em 0;padding:.6em 1.3em;background:var(--edge);color:#03110e;text-decoration:none;font:700 15px var(--head);clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.wrap a.btn:hover,.wrap a.btn:focus-visible{background:var(--gold);color:#03110e}
</style></head><body>
<div id="under"></div>
<canvas id="c"></canvas>
<div id="brand"><div id="name"></div><div id="tag"></div></div>
<button id="prev" class="pk"></button><button id="next" class="pk"></button><button id="back">‹ Back</button>
<div id="stage"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pretty=s=>s.replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ================= PALETTE =================
   Default scheme: cold teal glass + gold spark.
   Per view, tint/edge colours are taken from that view's cover image (falls back to teal). */
const GOLD=[1,.78,.4],TEAL={t:[.5,.9,.82],e:[.45,.9,.8],s:GOLD};
function paletteOf(src){const k=document.createElement('canvas');k.width=k.height=24;const x=k.getContext('2d');x.drawImage(src,0,0,24,24);const d=x.getImageData(0,0,24,24).data;
 let a=[0,0,0],w=0;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],m=Math.max(r,g,b),s=m-Math.min(r,g,b),q=s*s*m/65025+1e-3;a[0]+=r*q;a[1]+=g*q;a[2]+=b*q;w+=q}
 a=a.map(v=>v/w/255);const m=Math.max(...a)||1;a=a.map(v=>v/m);
 if(Math.max(...a)-Math.min(...a)<.12)return TEAL; // grey image: keep default scheme
 return{t:a.map(v=>v*.6+.4),e:a.map(v=>v*.8+.2),s:a.map(v=>v*.65+.35)}}

/* ================= GLASS =================
   One spring system drives everything: pointer push, hold-to-crack, and the burst (an impulse).
   Nothing is phased or locked, so input is never blocked. The cover image no longer shows on the glass:
   it only tints the palette and fills the masked prev/next/back panels. */
const VS=`attribute float aEdge;varying float vE;varying vec3 vN;
void main(){vE=aEdge;vN=normalize(mat3(modelMatrix)*vec3(0.,0.,1.));gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);}`;
const FS=`uniform float uHold;uniform vec2 uRes,uMouse;uniform vec3 uEdge,uSpark;varying float vE;varying vec3 vN;
float hs(float n){return fract(sin(n*91.7)*437.58);}
void main(){vec2 p=gl_FragCoord.xy;float f=pow(1.-abs(vN.z),2.);
vec3 c=vec3(.02,.05,.055)+uEdge*.12*f;float a=.6+.3*f;
#ifdef CRACK
if(uHold>0.){vec2 d=p-uMouse;float r=length(d)+.001,an=atan(d.y,d.x)*1.4324,lw=1.3*uRes.y/800.,cell=floor(an+.5);
float reach=(.05+.16*hs(cell))*uRes.y*uHold,w=max(lw/r*1.4324,.0005);
float ray=(1.-smoothstep(0.,w,abs(fract(an+.5)-.5)))*(1.-smoothstep(reach*.6,reach,r));
float rr=r/(uRes.y*.045),pd=abs(fract(rr+.5)-.5)*uRes.y*.045;
float ring=(1.-smoothstep(0.,lw,pd))*(1.-smoothstep(reach*.45,reach*.8,r))*step(.45,hs(cell+floor(rr)*7.));
float crack=clamp(ray+ring*.8,0.,1.)*smoothstep(0.,.15,uHold);
c=mix(c,mix(uEdge,vec3(1.),.55)*1.3,crack);a=max(a,crack);}
#endif
gl_FragColor=vec4(c,a);}`;
let R=null,S,Cam,M,MF,G,U,W,H,sh=[],F=[],mw=null,O={x:0,y:0},down=false,hold=0;
const AX=['x','y','z'],RGB=['r','g','b'],TAU=Math.PI*2,Tspark=[1,.78,.4],Tedge=[.45,.9,.8],cssE=[.45,.9,.8];
const entries=new Map(),DEF={pal:TEAL};
function entry(url){if(!url)return Promise.resolve(DEF);if(entries.has(url))return entries.get(url);
 const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{let pal=TEAL;try{pal=paletteOf(im)}catch(e){}res({pal})};im.onerror=()=>res(DEF);im.src=url});entries.set(url,p);return p}
let want=0;
function setCover(url){const my=++want;entry(url).then(e=>{if(my!==want)return;Tspark.splice(0,3,...e.pal.s);Tedge.splice(0,3,...e.pal.e)})}

function initGL(){
 try{R=new THREE.WebGLRenderer({canvas:$('#c'),alpha:true,antialias:true})}catch(e){R=null;return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 S=new THREE.Scene();Cam=new THREE.PerspectiveCamera(50,1,.1,50);Cam.position.z=10;
 U={uHold:{value:0},uRes:{value:new THREE.Vector2()},uMouse:{value:new THREE.Vector2(-9999,0)},uEdge:{value:new THREE.Color(...Tedge)},uSpark:{value:new THREE.Color(...GOLD)}};
 const mk=d=>new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide,transparent:true,depthWrite:false,defines:d});
 M=mk({CRACK:1});MF=mk({});
 G=new THREE.Group();S.add(G);
 let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(build,150)});build();loop()}
function initF(){F.forEach(s=>{G.remove(s.m);s.m.geometry.dispose()});F.length=0;
for(let q=0;q<70;q++){const n=3+(Math.random()*3|0),sz=.1+Math.pow(Math.random(),2)*.4,st=1+Math.random()*1.8,pos=new Float32Array((n+1)*3),ed=new Float32Array(n+1),ix=[];
for(let k=0;k<n;k++){const a=(k+Math.random()*.6)/n*6.283,r=sz*(.6+Math.random()*.6);pos.set([Math.cos(a)*r*st,Math.sin(a)*r,0],(k+1)*3);ed[k+1]=1;ix.push(0,k+1,(k+1)%n+1)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aEdge',new THREE.BufferAttribute(ed,1));g.setIndex(ix);
const m=new THREE.Mesh(g,MF),z=Math.random()*8-3,k=(10-z)/10;m.position.set((Math.random()-.5)*W*1.1*k,(Math.random()-.5)*H*1.1*k,z);m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);G.add(m);
F.push({m,v:[0,0,0],b:[(Math.random()-.5)*.25,(Math.random()-.5)*.25,(Math.random()-.5)*.15],sp:[(Math.random()-.5)*2.4,(Math.random()-.5)*2.4,(Math.random()-.5)*1.6]})}}
function build(){const w=innerWidth,h=innerHeight;R.setSize(w,h);Cam.aspect=w/h;Cam.updateProjectionMatrix();
const b=new THREE.Vector2();R.getDrawingBufferSize(b);U.uRes.value.copy(b);H=2*10*Math.tan(25*Math.PI/180);W=H*w/h;
sh.forEach(s=>{G.remove(s.m);s.m.geometry.dispose()});sh=[];
const mx=Math.hypot(W,H)/2,P=[];for(let i=0;i<110;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),1.5)*mx*1.1;P.push([Math.cos(a)*r,Math.sin(a)*r])}
P.forEach((p,i)=>{let poly=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]];
for(let j=0;j<P.length&&poly.length;j++){if(j==i)continue;const q=P[j],nx=q[0]-p[0],ny=q[1]-p[1],c=(nx*(p[0]+q[0])+ny*(p[1]+q[1]))/2,o=[];
for(let k=0;k<poly.length;k++){const A=poly[k],B=poly[(k+1)%poly.length],da=A[0]*nx+A[1]*ny-c,db=B[0]*nx+B[1]*ny-c;
if(da<=0)o.push(A);if(da*db<0){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t])}}poly=o}
if(poly.length<3)return;let cx=0,cy=0;poly.forEach(v=>{cx+=v[0];cy+=v[1]});cx/=poly.length;cy/=poly.length;
const n=poly.length,pos=new Float32Array((n+1)*3),ed=new Float32Array(n+1),ix=[];
poly.forEach((v,k)=>{pos.set([v[0]-cx,v[1]-cy,0],(k+1)*3);ed[k+1]=1;ix.push(0,k+1,(k+1)%n+1)});
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aEdge',new THREE.BufferAttribute(ed,1));g.setIndex(ix);
const m=new THREE.Mesh(g,M);m.position.set(cx,cy,0);G.add(m);sh.push({m,hx:cx,hy:cy,v:[0,0,0],w:[0,0,0],ph:Math.random()*6.28,pend:null})});initF()}

/* Burst = impulse into the spring system. Only called on a page/panel change. Can be re-fired any time. */
function burst(px,py){if(!R||!W)return;const now=performance.now()/1e3;O={x:(px/innerWidth-.5)*W,y:(.5-py/innerHeight)*H};
 sh.forEach(s=>{const dx=s.hx-O.x,dy=s.hy-O.y,d=Math.hypot(dx,dy)||.01,n=(26+Math.random()*22)/(1+d*.08);
  s.pend={t:now+d*.025,v:[dx/d*n,dy/d*n,rnd(18,34)],w:[rnd(-14,14),rnd(-14,14),rnd(-10,10)]}});
 F.forEach(s=>{const dx=s.m.position.x-O.x,dy=s.m.position.y-O.y,d=Math.hypot(dx,dy)+.1,f=9/(1+d*.4);s.v[0]+=dx/d*f;s.v[1]+=dy/d*f;s.v[2]+=2+Math.random()*3;s.sp=s.sp.map(v=>v+(Math.random()-.5)*8)})}
function mv(e){if(!W)return;mw={x:(e.clientX/innerWidth-.5)*W,y:(.5-e.clientY/innerHeight)*H};U&&U.uMouse.value.set(e.clientX*R.getPixelRatio(),(innerHeight-e.clientY)*R.getPixelRatio())}
addEventListener('pointermove',e=>{if(R)mv(e)});
addEventListener('pointerdown',e=>{if(R){mv(e);down=true}});
const up=e=>{down=false;if(R&&e.pointerType==='touch')mw=null};
addEventListener('pointerup',up);addEventListener('pointercancel',up);
document.documentElement.addEventListener('mouseleave',()=>{if(R){mw=null;down=false}});
let last=performance.now()/1e3,moved=0;
function loop(){requestAnimationFrame(loop);const now=performance.now()/1e3,dt=Math.min(.05,now-last);last=now;
 if(page&&now-moved>3)return; // canvas is fully hidden behind the page; resumes on the next transition
 const cs=U.uSpark.value;let dd=0;
 for(let i=0;i<3;i++){const a=RGB[i];cs[a]+=(Tspark[i]-cs[a])*.08;dd+=Math.abs(Tedge[i]-cssE[i]);cssE[i]+=(Tedge[i]-cssE[i])*.08}
 U.uEdge.value.setRGB(cssE[0],cssE[1],cssE[2]);
 if(dd>.004)document.documentElement.style.setProperty('--edge',`rgb(${cssE[0]*255|0},${cssE[1]*255|0},${cssE[2]*255|0})`);
 hold=Math.max(0,Math.min(1,hold+(down?dt/.8:-dt*4)));U.uHold.value=Math.pow(hold,1.5);
 if(!mw&&hold<.01)U.uMouse.value.set(-9999,0);
 const kP=48,cP=9,kR=40,cR=5;
 sh.forEach(s=>{const m=s.m,p=m.position,r=m.rotation;
  if(s.pend&&now>=s.pend.t){for(let i=0;i<3;i++){s.v[i]+=s.pend.v[i];s.w[i]+=s.pend.w[i]}s.pend=null}
  let tx=0,ty=0,tz=0,rx=0,ry=0,jr=0;
  if(mw){const dx=s.hx-mw.x,dy=s.hy-mw.y,d=Math.hypot(dx,dy)+.01,f=Math.exp(-d*d/(2.2*(1+hold*.8)));
   tx=dx/d*f*.7*(1-hold*.5);ty=dy/d*f*.7*(1-hold*.5);tz=f*(.6-1.5*hold);rx=-dy/d*f*.6;ry=dx/d*f*.6;jr=Math.sin(now*70+s.ph)*.05*hold*f}
  s.v[0]+=((s.hx+tx-p.x)*kP-cP*s.v[0])*dt;s.v[1]+=((s.hy+ty-p.y)*kP-cP*s.v[1])*dt;s.v[2]+=((tz-p.z)*kP-cP*s.v[2])*dt;
  p.x+=s.v[0]*dt;p.y+=s.v[1]*dt;p.z+=s.v[2]*dt;
  const tg=[rx,ry,jr];for(let i=0;i<3;i++){const a=AX[i],t=Math.round(r[a]/TAU)*TAU+tg[i];s.w[i]+=((t-r[a])*kR-cR*s.w[i])*dt;r[a]+=s.w[i]*dt}});
 F.forEach(s=>{const m=s.m,p=m.position,k=(10-p.z)/10;
  if(mw){const dx=p.x-mw.x*k,dy=p.y-mw.y*k,d=Math.hypot(dx,dy)+.01,f=Math.exp(-d*d/1.5);s.v[0]+=dx/d*f*16*dt;s.v[1]+=dy/d*f*16*dt;s.v[2]+=f*4*dt}
  const e=Math.min(1,1.2*dt);for(let i=0;i<3;i++)s.v[i]+=(s.b[i]-s.v[i])*e;
  p.x+=s.v[0]*dt;p.y+=s.v[1]*dt;p.z+=s.v[2]*dt;if(p.z>6&&s.v[2]>0)s.v[2]*=-1;if(p.z<-3&&s.v[2]<0)s.v[2]*=-1;
  m.rotation.x+=s.sp[0]*dt;m.rotation.y+=s.sp[1]*dt;m.rotation.z+=s.sp[2]*dt;for(let i=0;i<3;i++)if(Math.abs(s.sp[i])>2.4)s.sp[i]*=.985;
  const bx=W/2*1.15*k,by=H/2*1.15*k;if(p.x>bx)p.x=-bx;if(p.x<-bx)p.x=bx;if(p.y>by)p.y=-by;if(p.y<-by)p.y=by});
 R.render(S,Cam)}

/* ================= TRANSITION: the screen itself is glass =================
   The whole UI layer (menu panes, page, side panes) is cloned and cut into shard tiles that live in the SAME
   perspective as the WebGL camera (CSS perspective = camera distance). Old screen: tiles break away from the tap.
   New screen: the real DOM is already live and clickable underneath (hidden only visually); its tiles fly in from depth
   and spring into place, then hand over to the live DOM. Nothing waits for the animation. */
const CSSD=()=>innerHeight/2/Math.tan(25*Math.PI/180);
function setD(){document.documentElement.style.setProperty('--D',CSSD()+'px')}setD();addEventListener('resize',setD);
const T={tiles:[],layer:null,raf:0,last:0},KP=85,CP=12,KR=70,CR=9;
function cells(){const w=innerWidth,h=innerHeight,cols=Math.max(2,Math.round(w/150)),rows=Math.max(2,Math.round(h/150)),P=[],out=[];
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)P.push([(c+.5+rnd(-.3,.3))*w/cols,(r+.5+rnd(-.3,.3))*h/rows]);
 P.forEach((p,i)=>{let poly=[[0,0],[w,0],[w,h],[0,h]];
  for(let j=0;j<P.length&&poly.length;j++){if(j==i)continue;const q=P[j],nx=q[0]-p[0],ny=q[1]-p[1],c=(nx*(p[0]+q[0])+ny*(p[1]+q[1]))/2,o=[];
   for(let k=0;k<poly.length;k++){const A=poly[k],B=poly[(k+1)%poly.length],da=A[0]*nx+A[1]*ny-c,db=B[0]*nx+B[1]*ny-c;
    if(da<=0)o.push(A);if(da*db<0){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t])}}poly=o}
  if(poly.length<3)return;let cx=0,cy=0;poly.forEach(v=>{cx+=v[0];cy+=v[1]});out.push({cx:cx/poly.length,cy:cy/poly.length,pts:poly})});
 return out}
function snapshot(){const w=document.createElement('div');w.className='snap';w.style.width=innerWidth+'px';w.style.height=innerHeight+'px';
 ['#stage','#prev','#next','#back','#brand'].forEach(s=>{const e=$(s);if(!e)return;const c=e.cloneNode(true);
  if(s==='#stage'&&e.scrollTop&&c.firstElementChild)c.firstElementChild.style.transform=`translateY(${-e.scrollTop}px)`;
  c.querySelectorAll('iframe').forEach(f=>{const d=document.createElement('div');d.style.cssText='aspect-ratio:16/9;width:100%;background:#000;margin:1em 0';f.replaceWith(d)});
  c.querySelectorAll('img').forEach(i=>i.loading='eager');w.appendChild(c)});
 return w}
const place=t=>{t.el.style.transform=`translate3d(${t.p[0]}px,${t.p[1]}px,${t.p[2]}px) rotateX(${t.r[0]}rad) rotateY(${t.r[1]}rad) rotateZ(${t.r[2]}rad)`};
function mkTiles(tpl,mode,o){if(!T.layer){T.layer=document.createElement('div');T.layer.id='tiles';document.body.appendChild(T.layer)}
 const L=T.layer,cs=cells(),now=performance.now()/1e3;L.style.perspective=CSSD()+'px';
 let md=1;cs.forEach(c=>{c.d=Math.hypot(c.cx-o.x,c.cy-o.y);md=Math.max(md,c.d)});
 cs.forEach(c=>{const ex=c.pts.map(p=>{const dx=p[0]-c.cx,dy=p[1]-c.cy,l=Math.hypot(dx,dy)||1;return[p[0]+dx/l,p[1]+dy/l]}), // 1px overlap hides seams
  xs=ex.map(p=>p[0]),ys=ex.map(p=>p[1]),bx=Math.min(...xs),by=Math.min(...ys),bw=Math.max(...xs)-bx,bh=Math.max(...ys)-by;
  const el=document.createElement('div');el.className='tile';el.style.left=c.cx+'px';el.style.top=c.cy+'px';
  const tp=document.createElement('div');tp.className='tp';tp.style.cssText=`left:${bx-c.cx}px;top:${by-c.cy}px;width:${bw}px;height:${bh}px;clip-path:polygon(${ex.map(p=>`${p[0]-bx}px ${p[1]-by}px`).join(',')})`;
  const sn=tpl.cloneNode(true);sn.style.left=-bx+'px';sn.style.top=-by+'px';tp.appendChild(sn);el.appendChild(tp);L.appendChild(el);
  const dx=c.cx-o.x,dy=c.cy-o.y,dl=Math.hypot(dx,dy)||1,
   t={el,mode,t0:now,delay:c.d/md*.12,cx:c.cx,cy:c.cy,d:c.d,p:[0,0,0],r:[0,0,0],v:[0,0,0],w:[0,0,0],dx:dx/dl,dy:dy/dl,go:0};
  if(mode==='asm'){const s=rnd(250,800);t.p=[t.dx*s,t.dy*s,-rnd(500,1700)];t.r=[rnd(-1.3,1.3),rnd(-1.3,1.3),rnd(-.6,.6)];t.w=[rnd(-5,5),rnd(-5,5),rnd(-4,4)];el.style.zIndex=1;el.style.opacity=0}
  else el.style.zIndex=2;
  place(t);T.tiles.push(t)})}
function tick(){T.raf=requestAnimationFrame(tick);const now=performance.now()/1e3,dt=Math.min(.033,now-T.last);T.last=now;let asm=0,unsettled=0;
 for(let i=T.tiles.length-1;i>=0;i--){const t=T.tiles[i],a=now-t.t0-t.delay;
  if(t.mode==='asm')asm++;
  if(t.done)continue;
  if(a<0){if(t.mode==='asm')unsettled++;continue}
  if(t.mode==='asm'){let fine=true;
   for(let k=0;k<3;k++){t.v[k]+=(-t.p[k]*KP-CP*t.v[k])*dt;t.p[k]+=t.v[k]*dt;const tg=Math.round(t.r[k]/TAU)*TAU;t.w[k]+=((tg-t.r[k])*KR-CR*t.w[k])*dt;t.r[k]+=t.w[k]*dt;
    if(Math.abs(t.p[k])>(k<2?.6:2)||Math.abs(t.v[k])>8||Math.abs(t.r[k]-tg)>.004||Math.abs(t.w[k])>.05)fine=false}
   if(!fine&&a<1.2)unsettled++;
   t.el.style.opacity=Math.min(1,a/.14);place(t);if(fine&&a>.14)t.done=1}
  else{if(!t.go){t.go=1;const n=(1800+rnd(0,1500))/(1+t.d/600);t.v[0]+=t.dx*n;t.v[1]+=t.dy*n;t.v[2]+=rnd(500,1100);t.w=[rnd(-9,9),rnd(-9,9),rnd(-7,7)]}
   const dr=Math.exp(-1.2*dt);for(let k=0;k<3;k++){t.v[k]*=dr;t.p[k]+=t.v[k]*dt;t.r[k]+=t.w[k]*dt}if(t.p[2]>420)t.p[2]=420;
   t.el.style.opacity=Math.max(0,1-a/.34);place(t);if(a>.36){t.el.remove();T.tiles.splice(i,1)}}}
 if(asm&&!unsettled){for(let i=T.tiles.length-1;i>=0;i--)if(T.tiles[i].mode==='asm'){T.tiles[i].el.remove();T.tiles.splice(i,1)}}
 if(!T.tiles.some(t=>t.mode==='asm'))document.body.classList.remove('asm');
 if(!T.tiles.length){cancelAnimationFrame(T.raf);T.raf=0}}
function transition(x,y,swap){
 moved=performance.now()/1e3;
 if(reduced){swap();return}
 const o={x,y},now=performance.now()/1e3,live=T.tiles.filter(t=>t.mode==='asm');
 if(live.length)live.forEach(t=>{const dx=t.cx-x,dy=t.cy-y,dl=Math.hypot(dx,dy)||1;Object.assign(t,{mode:'brk',t0:now,delay:0,go:0,d:dl,dx:dx/dl,dy:dy/dl});t.el.style.zIndex=2}); // broke mid-assembly: carry on from where it is
 else mkTiles(snapshot(),'brk',o);
 document.body.classList.add('asm');
 swap();
 mkTiles(snapshot(),'asm',o);
 burst(x,y);
 if(!T.raf){T.last=now;T.raf=requestAnimationFrame(tick)}}

/* ================= MARKDOWN ================= */
const url=(p,s,sm)=>/^(https?:|data:)/.test(s)?s:`projects/${p.path}/${sm&&p.small?'images-small':'images'}/${encodeURI(s)}`;
const lnk=(p,u)=>/^(https?:|mailto:|#)/.test(u)?u:`projects/${p.path}/${encodeURI(u)}`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function inline(s,p){s=esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,a,u)=>`<img src="${url(p,u)}" alt="${a}" loading="lazy">`)
 .replace(/\[([^\]]+)\]\(([^)\s]+)\)(\{button\})?/g,(_,t,u,b)=>`<a href="${lnk(p,u)}"${b?' class="btn"':''} target="_blank" rel="noopener">${t}</a>`);
 return s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function embed(u){let m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/))return `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 if(m=u.match(/vimeo\.com\/(\d+)/))return `<iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(u))return `<img src="${u}" loading="lazy" alt="">`;
 return `<p><a href="${u}" target="_blank" rel="noopener">${u}</a></p>`}
function md(t,p){let o='',list=null,code=false;const close=()=>{if(list){o+=`</${list}>`;list=null}};
 for(const raw of t.replace(/\r/g,'').split('\n')){const l=raw.trim();let m;
  if(l.startsWith('```')){close();code=!code;o+=code?'<pre><code>':'</code></pre>';continue}
  if(code){o+=esc(raw)+'\n';continue}if(!l){close();continue}
  if(m=l.match(/^(#{1,4})\s+(.*)/)){close();o+=`<h${m[1].length}>${inline(m[2],p)}</h${m[1].length}>`}
  else if(m=l.match(/^([-*]|\d+\.)\s+(.*)/)){const k=/\d/.test(m[1])?'ol':'ul';if(list!==k){close();o+=`<${k}>`;list=k}o+=`<li>${inline(m[2],p)}</li>`}
  else if(/^https?:\/\/\S+$/.test(l)){close();o+=embed(l)}else{close();o+=`<p>${inline(l,p)}</p>`}}
 close();return o}

/* ================= NAVIGATION ================= */
const count=n=>n.projects.length+Object.values(n.kids).reduce((a,k)=>a+count(k),0);
const firstCover=n=>{for(const p of n.projects)if(p.cover)return p;for(const k of Object.values(n.kids)){const c=firstCover(k);if(c)return c}};
let stack=[],page=null,baseCover=null;
const stage=$('#stage');
let items=[],seams=[];
const mkSeam=()=>[0,rnd(.18,.3),rnd(.42,.55),rnd(.68,.8),1].map(t=>[t,rnd(-1,1)]);
/* Menu = the screen split into full-bleed artwork panels, cut by shared jagged seams. Landscape: columns. Portrait: rows. */
function layout(){const n=items.length,W=innerWidth,H=innerHeight,land=W>H,A=land?W:H,B=land?H:W,g=5,
 bd=(k,s)=>k<=0?[[0,0],[0,B]]:k>=n?[[A,0],[A,B]]:seams[k-1].map(([t,j])=>[(k/n+j*.4/n)*A+s,t*B]);
 stage.querySelectorAll('.it').forEach((el,i)=>{const P=[...bd(i,g),...bd(i+1,-g).reverse()].map(([a,b])=>land?`${a}px ${b}px`:`${b}px ${a}px`);
  el.style.clipPath=`polygon(${P})`;const t=el.querySelector('.tx');
  t.style[land?'left':'top']=(i+.5)/n*100+'%';t.style[land?'top':'left']='50%';t.style.width=land?`calc(${100/n}% - 28px)`:'min(86%,520px)'})}
addEventListener('resize',()=>{if(!page&&items.length)layout()});
function showMenu(node){
 page=null;stage.classList.remove('page');stage.style.removeProperty('--art');
 items=[...Object.values(node.kids).map(k=>({label:pretty(k.name),sub:count(k)+(count(k)>1?' projects':' project'),node:k,pr:firstCover(k)})),
  ...node.projects.map(p=>({label:p.name,sub:'',p,pr:p.cover?p:null}))];
 seams=items.slice(1).map(mkSeam);
 stage.innerHTML=`<div id="menu">${items.map((it,i)=>`<button class="it" data-i="${i}"><span class="bg" style="${it.pr?`--th:url('${it.pr.coverFull}')`:''}"></span><span class="tx"><b>${esc(it.label)}</b>${it.sub?`<i>${it.sub}</i>`:''}</span></button>`).join('')}</div>`;
 layout();baseCover=(firstCover(node)||{}).cover||null;setCover(baseCover);crumb()}
function showPage(p){
 page=p;stage.classList.add('page');
 if(p.coverFull)stage.style.setProperty('--art',`url('${p.coverFull}')`);else stage.style.removeProperty('--art');
 stage.innerHTML=`<div class="wrap">${md(p.md,p)}</div>`;stage.scrollTop=0;
 baseCover=p.cover||null;setCover(baseCover);crumb()}
function sibs(){const top=stack[stack.length-1];
 if(page){const l=top.projects;return{l:l.map(p=>({p,label:p.name,pr:p.cover?p:null})),i:l.indexOf(page)}}
 if(stack.length>1){const l=Object.values(stack[stack.length-2].kids);return{l:l.map(k=>({node:k,label:pretty(k.name),pr:firstCover(k)})),i:l.indexOf(top)}}
 return{l:[],i:-1}}
function paint(el,it,txt,arrow){if(!it){el.classList.remove('on');el._it=null;return}
 el._it=it;el.classList.add('on');it.pr?el.style.setProperty('--th',`url('${it.pr.coverFull}')`):el.style.removeProperty('--th');
 el.innerHTML=`<span>${arrow==='<'?'‹ ':''}${esc(txt)}${arrow==='>'?' ›':''}</span>`}
function crumb(){const {l,i}=sibs();paint($('#prev'),i>0?l[i-1]:null,i>0?l[i-1].label:'','<');paint($('#next'),i>=0&&i<l.length-1?l[i+1]:null,i>=0&&i<l.length-1?l[i+1].label:'','>');
 $('#back').classList.toggle('on',!!page||stack.length>1)}
const open=(it,x,y,push)=>transition(x,y,()=>{if(it.node){push?stack.push(it.node):stack[stack.length-1]=it.node;showMenu(it.node)}else showPage(it.p)});
function centre(e,el){if(e&&e.detail>0&&e.clientX!==undefined)return[e.clientX,e.clientY];const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
stage.addEventListener('click',e=>{const b=e.target.closest('.it');if(b)open(items[+b.dataset.i],...centre(e,b),true)});
stage.addEventListener('pointerover',e=>{const b=e.target.closest('.it');if(!b||page)return;const it=items[+b.dataset.i];if(it.pr)setCover(it.pr.cover)});
stage.addEventListener('pointerout',e=>{if(page)return;const b=e.target.closest('.it');if(b&&!b.contains(e.relatedTarget))setCover(baseCover)});
function back(e){if(!page&&stack.length<=1)return;const [x,y]=e&&e.detail>0&&e.clientX!==undefined?[e.clientX,e.clientY]:[innerWidth-60,36];
 transition(x,y,()=>{if(page)showMenu(stack[stack.length-1]);else{stack.pop();showMenu(stack[stack.length-1])}})}
$('#back').onclick=back;
['prev','next'].forEach(id=>{const b=$('#'+id);b.onclick=e=>{if(b._it){open(b._it,...centre(e,b))}}});
addEventListener('keydown',e=>{if(e.key==='Escape')back();
 if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const b=$(e.key==='ArrowLeft'?'#prev':'#next');if(b._it){open(b._it,...centre(null,b))}}});

Promise.all([fetch('projects.json').then(r=>r.json()).catch(()=>[]),fetch('site.md').then(r=>r.ok?r.text():'').catch(()=>'')]).then(([list,site])=>{
 const nm=(site.match(/^#\s+(.+)/m)||[])[1]||'',tg=(site.split('\n').find(l=>l.trim()&&!l.startsWith('#'))||'').trim();
 $('#name').textContent=nm;$('#tag').textContent=tg;if(nm)document.title=nm;
 const root={name:'',kids:{},projects:[]};
 list.forEach(p=>{const m=p.md.match(/!\[[^\]]*\]\(([^)\s]+)\)/)||p.md.match(/^(https?:\/\/\S+\.(?:png|jpe?g|webp|gif))\s*$/m);
  p.cover=m?url(p,m[1],true):null;p.coverFull=m?url(p,m[1],false):null;
  let n=root;p.parts.forEach(s=>{n=n.kids[s]??={name:s,kids:{},projects:[]}});n.projects.push(p)});
 initGL();
 if(!list.length){stage.innerHTML='<div id="empty" style="display:block">No projects found.<br>Run build.py, then reload.</div>';return}
 stack=[root];showMenu(root);setCover(baseCover,true)});
</script></body></html>
