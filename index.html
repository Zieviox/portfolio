<style>

.it.big{width:clamp(150px,34vw,300px);height:clamp(130px,26vw,230px)}

 background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.02)),linear-gradient(rgba(4,8,10,.45),rgba(4,8,10,.45)),var(--th,linear-gradient(rgba(30,110,105,.35),rgba(30,110,105,.35)));background-size:auto,auto,cover;background-position:center;
 -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}

.wrap a.btn:hover,.wrap a.btn:focus-visible{background:var(--gold);color:#03110e}
@media (prefers-reduced-motion:reduce){#menu,.wrap{animation:none}}

<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),pretty=s=>s.replace(/[-_]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ================= PALETTE =================
   Default scheme: cold teal glass + gold spark.
   Per view, tint/edge colours are taken from that view's cover image (falls back to teal). */
const TEAL={t:[.5,.9,.82],e:[.45,.9,.8]};
function paletteOf(src){const k=document.createElement('canvas');k.width=k.height=24;const x=k.getContext('2d');x.drawImage(src,0,0,24,24);const d=x.getImageData(0,0,24,24).data;
 let a=[0,0,0],w=0;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],m=Math.max(r,g,b),s=m-Math.min(r,g,b),q=s*s*m/65025+1e-3;a[0]+=r*q;a[1]+=g*q;a[2]+=b*q;w+=q}

/* ================= GLASS (from glass-test, extended) ================= */
const VS=`attribute float aEdge;varying float vE;varying vec3 vN;
void main(){vE=aEdge;vN=normalize(mat3(modelMatrix)*vec3(0.,0.,1.));gl_Position=projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);}`;
const FS=`uniform sampler2D uTex,uTex2;uniform float uMix,uDim;uniform vec2 uRes,uImg,uImg2,uMouse;uniform vec3 uTint,uEdge,uSpark;varying float vE;varying vec3 vN;

let R=null,S,Cam,M,G,U,W,H,sh=[],F=[],phase='rest',t0=0,t1=0,mw=null,O={x:0,y:0},onRest=null;
const Ttint=[1,1,1],Tedge=[1,1,1];
function mkDefault(){const c=document.createElement('canvas');c.width=1280;c.height=800;const x=c.getContext('2d');
 const g=x.createRadialGradient(640,280,0,640,400,820);g.addColorStop(0,'#10282b');g.addColorStop(1,'#04080a');x.fillStyle=g;x.fillRect(0,0,1280,800);
 x.font='14px monospace';for(let i=0;i<1400;i++){const px=Math.random()*1280,py=Math.random()*800,d=Math.hypot(px-640,py-400)/700;x.fillStyle=`rgba(127,232,210,${Math.max(0,.1*(1-d))})`;x.fillText(Math.random()<.5?'0':'1',px,py)}
 return c}
const DEFC=mkDefault();
const entries=new Map();
const DEF={c:DEFC,w:1280,h:800,pal:TEAL,url:DEFC.toDataURL('image/jpeg',.8)};
function entry(url){if(!url)return Promise.resolve(DEF);if(entries.has(url))return entries.get(url);
 const p=new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   let pal=TEAL;try{pal=paletteOf(c)}catch(e){}res({c,w:c.width,h:c.height,pal,url})};
  im.onerror=()=>res(DEF);im.src=url});entries.set(url,p);return p}
const texOf=e=>{if(!e.tex){e.tex=new THREE.CanvasTexture(e.c);e.tex.minFilter=THREE.LinearFilter;e.tex.generateMipmaps=false}return e.tex};
let cur=DEF,tgt=null,fm=0,want=0;
function setCover(url,instant){const my=++want;entry(url).then(e=>{if(my!==want)return;
 Ttint.splice(0,3,...e.pal.t);Tedge.splice(0,3,...e.pal.e);
 $('#under').style.backgroundImage=`url("${e.url||url}")`;
 if(!R||e===cur&&!tgt)return;
 if(instant){cur=e;tgt=null;fm=0;U.uTex.value=texOf(e);U.uImg.value.set(e.w,e.h);U.uMix.value=0;return}
 if(tgt&&fm>.5){cur=tgt}tgt=e;fm=0;U.uMix.value=0;U.uTex.value=texOf(cur);U.uImg.value.set(cur.w,cur.h);U.uTex2.value=texOf(e);U.uImg2.value.set(e.w,e.h)})}

function initGL(){
 try{R=new THREE.WebGLRenderer({canvas:$('#c'),alpha:true,antialias:true})}catch(e){R=null;return}
 R.setPixelRatio(Math.min(devicePixelRatio,2));
 S=new THREE.Scene();Cam=new THREE.PerspectiveCamera(50,1,.1,50);Cam.position.z=10;
 const t0x=new THREE.CanvasTexture(DEFC);t0x.minFilter=THREE.LinearFilter;t0x.generateMipmaps=false;DEF.tex=t0x;
 U={uTex:{value:t0x},uTex2:{value:t0x},uMix:{value:0},uDim:{value:.6},uRes:{value:new THREE.Vector2()},uImg:{value:new THREE.Vector2(1280,800)},uImg2:{value:new THREE.Vector2(1280,800)},uMouse:{value:new THREE.Vector2(-9999,0)},
  uTint:{value:new THREE.Color(...TEAL.t)},uEdge:{value:new THREE.Color(...TEAL.e)},uSpark:{value:new THREE.Color(1,.78,.4)}};
 M=new THREE.ShaderMaterial({uniforms:U,vertexShader:VS,fragmentShader:FS,side:THREE.DoubleSide});
 G=new THREE.Group();S.add(G);
 Ttint.splice(0,3,...TEAL.t);Tedge.splice(0,3,...TEAL.e);
 addEventListener('resize',build);build();loop()}
function initF(){F.forEach(s=>{G.remove(s.m);s.m.geometry.dispose()});F.length=0;
for(let q=0;q<70;q++){const n=3+(Math.random()*3|0),sz=.1+Math.pow(Math.random(),2)*.4,st=1+Math.random()*1.8,pos=new Float32Array((n+1)*3),ed=new Float32Array(n+1),ix=[];
for(let k=0;k<n;k++){const a=(k+Math.random()*.6)/n*6.283,r=sz*(.6+Math.random()*.6);pos.set([Math.cos(a)*r*st,Math.sin(a)*r,0],(k+1)*3);ed[k+1]=1;ix.push(0,k+1,(k+1)%n+1)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aEdge',new THREE.BufferAttribute(ed,1));g.setIndex(ix);
const m=new THREE.Mesh(g,M),z=Math.random()*8-3,k=(10-z)/10;m.position.set((Math.random()-.5)*W*1.1*k,(Math.random()-.5)*H*1.1*k,z);m.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);G.add(m);
F.push({m,v:[0,0,0],b:[(Math.random()-.5)*.25,(Math.random()-.5)*.25,(Math.random()-.5)*.15],sp:[(Math.random()-.5)*2.4,(Math.random()-.5)*2.4,(Math.random()-.5)*1.6]})}}
function build(){const w=innerWidth,h=innerHeight;R.setSize(w,h);Cam.aspect=w/h;Cam.updateProjectionMatrix();
const b=new THREE.Vector2();R.getDrawingBufferSize(b);U.uRes.value.copy(b);H=2*10*Math.tan(25*Math.PI/180);W=H*w/h;
sh.forEach(s=>{G.remove(s.m);s.m.geometry.dispose()});sh=[];phase='rest';
const mx=Math.hypot(W,H)/2,P=[];for(let i=0;i<110;i++){const a=Math.random()*6.283,r=Math.pow(Math.random(),1.5)*mx*1.1;P.push([Math.cos(a)*r,Math.sin(a)*r])}
P.forEach((p,i)=>{let poly=[[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]];
for(let j=0;j<P.length&&poly.length;j++){if(j==i)continue;const q=P[j],nx=q[0]-p[0],ny=q[1]-p[1],c=(nx*(p[0]+q[0])+ny*(p[1]+q[1]))/2,o=[];
for(let k=0;k<poly.length;k++){const A=poly[k],B=poly[(k+1)%poly.length],da=A[0]*nx+A[1]*ny-c,db=B[0]*nx+B[1]*ny-c;
if(da<=0)o.push(A);if(da*db<0){const t=da/(da-db);o.push([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t])}}poly=o}
if(poly.length<3)return;let cx=0,cy=0;poly.forEach(v=>{cx+=v[0];cy+=v[1]});cx/=poly.length;cy/=poly.length;
const n=poly.length,pos=new Float32Array((n+1)*3),ed=new Float32Array(n+1),ix=[];
poly.forEach((v,k)=>{pos.set([v[0]-cx,v[1]-cy,0],(k+1)*3);ed[k+1]=1;ix.push(0,k+1,(k+1)%n+1)});
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('aEdge',new THREE.BufferAttribute(ed,1));g.setIndex(ix);
const m=new THREE.Mesh(g,M);m.position.set(cx,cy,0);G.add(m);sh.push({m,hx:cx,hy:cy})});initF()}
function shatter(px,py){if(!R||phase!=='rest'||!W)return false;phase='fly';t0=performance.now()/1e3;O={x:(px/innerWidth-.5)*W,y:(.5-py/innerHeight)*H};
sh.forEach(s=>{let dx=s.hx-O.x,dy=s.hy-O.y,d=Math.hypot(dx,dy)||.01;s.dx=dx/d;s.dy=dy/d;s.dl=d*.04;s.spd=(3+Math.random()*4)/(1+d*.12);s.zv=3+Math.random()*5;
 s.sp=[Math.random()*7-3.5,Math.random()*7-3.5,Math.random()*5-2.5]});
F.forEach(s=>{const dx=s.m.position.x-O.x,dy=s.m.position.y-O.y,d=Math.hypot(dx,dy)+.1,f=9/(1+d*.4);s.v[0]+=dx/d*f;s.v[1]+=dy/d*f;s.v[2]+=2+Math.random()*3;s.sp=s.sp.map(v=>v+(Math.random()-.5)*8)});return true}
function mv(e){if(!W)return;mw={x:(e.clientX/innerWidth-.5)*W,y:(.5-e.clientY/innerHeight)*H};U&&U.uMouse.value.set(e.clientX*R.getPixelRatio(),(innerHeight-e.clientY)*R.getPixelRatio())}
addEventListener('pointermove',e=>{if(R)mv(e)});
addEventListener('pointerdown',e=>{if(R)mv(e)});
addEventListener('pointerup',e=>{if(R&&e.pointerType==='touch'){mw=null;U.uMouse.value.set(-9999,0)}});
document.documentElement.addEventListener('mouseleave',()=>{if(R){mw=null;U.uMouse.value.set(-9999,0)}});
let last=performance.now()/1e3;
function loop(){requestAnimationFrame(loop);const now=performance.now()/1e3,dt=Math.min(.05,now-last);last=now;
 // palette + texture crossfade
 const ct=U.uTint.value,ce=U.uEdge.value;let dd=0;
 for(let i=0;i<3;i++){const a=['r','g','b'][i];dd+=Math.abs(Tedge[i]-ce[a]);ct[a]+=(Ttint[i]-ct[a])*.08;ce[a]+=(Tedge[i]-ce[a])*.08}
 if(dd>.004)document.documentElement.style.setProperty('--edge',`rgb(${ce.r*255|0},${ce.g*255|0},${ce.b*255|0})`);
 if(tgt){fm=Math.min(1,fm+dt/.5);U.uMix.value=fm*fm*(3-2*fm);if(fm>=1){cur=tgt;tgt=null;fm=0;U.uTex.value=texOf(cur);U.uImg.value.set(cur.w,cur.h);U.uMix.value=0}}
 sh.forEach(s=>{const m=s.m;
 if(phase==='rest'){let tx=0,ty=0,tz=0;if(mw){const dx=s.hx-mw.x,dy=s.hy-mw.y,d=Math.hypot(dx,dy)+.01,f=Math.exp(-d*d/2.2);tx=dx/d*f*.7;ty=dy/d*f*.7;tz=f*.6;s.rx=-dy/d*f*.6;s.ry=dx/d*f*.6}else{s.rx=s.ry=0}
 m.position.x+=(s.hx+tx-m.position.x)*.12;m.position.y+=(s.hy+ty-m.position.y)*.12;m.position.z+=(tz-m.position.z)*.12;
 m.rotation.x+=((s.rx||0)-m.rotation.x)*.12;m.rotation.y+=((s.ry||0)-m.rotation.y)*.12;m.rotation.z*=.88}
 else if(phase==='fly'){const u=Math.max(0,now-t0-s.dl),k=1-Math.exp(-2.8*u);m.position.set(s.hx+s.dx*s.spd*k*1.6,s.hy+s.dy*s.spd*k*1.6,s.zv*k*1.8);
 if(u>0){m.rotation.x+=s.sp[0]*dt;m.rotation.y+=s.sp[1]*dt;m.rotation.z+=s.sp[2]*dt}}
 else{const u=Math.min(1,Math.max(0,(now-t1-s.bd)/.95)),e=u*u*(3-2*u),f=s.fr;
 m.position.set(f[0]+(s.hx-f[0])*e,f[1]+(s.hy-f[1])*e,f[2]*(1-e));m.rotation.set(f[3]*(1-e),f[4]*(1-e),f[5]*(1-e))}});
 if(phase==='fly'){if(now-t0>1.05){phase='back';t1=now;sh.forEach(s=>{const m=s.m;s.fr=[m.position.x,m.position.y,m.position.z,m.rotation.x,m.rotation.y,m.rotation.z];s.bd=Math.random()*.3})}}
 else if(phase==='back'&&now-t1>1.3){phase='rest';if(onRest){const f=onRest;onRest=null;f()}}
 F.forEach(s=>{const m=s.m,p=m.position,k=(10-p.z)/10;
 if(mw){const dx=p.x-mw.x*k,dy=p.y-mw.y*k,d=Math.hypot(dx,dy)+.01,f=Math.exp(-d*d/1.5);s.v[0]+=dx/d*f*16*dt;s.v[1]+=dy/d*f*16*dt;s.v[2]+=f*4*dt}
 const e=Math.min(1,1.2*dt);for(let i=0;i<3;i++)s.v[i]+=(s.b[i]-s.v[i])*e;
 p.x+=s.v[0]*dt;p.y+=s.v[1]*dt;p.z+=s.v[2]*dt;if(p.z>6&&s.v[2]>0)s.v[2]*=-1;if(p.z<-3&&s.v[2]<0)s.v[2]*=-1;
 m.rotation.x+=s.sp[0]*dt;m.rotation.y+=s.sp[1]*dt;m.rotation.z+=s.sp[2]*dt;s.sp=s.sp.map(v=>Math.abs(v)>2.4?v*.985:v);
 const bx=W/2*1.15*k,by=H/2*1.15*k;if(p.x>bx)p.x=-bx;if(p.x<-bx)p.x=bx;if(p.y>by)p.y=-by;if(p.y<-by)p.y=by});
 R.render(S,Cam)}

/* ================= BREAK TRANSITION =================
   Like DMC's shots -> rank: impact web flashes, the pane bursts toward the camera,
   the next screen shows through the flying shards, and the glass reforms over it. */
const CR=$('#cr'),cc=CR.getContext('2d');
function cracks(x,y,done){
 const D=Math.min(devicePixelRatio||1,2),w=innerWidth,h=innerHeight;CR.width=w*D;CR.height=h*D;CR.style.opacity=1;cc.setTransform(D,0,0,D,0,0);
 const L=Math.hypot(w,h)*.55,rays=[],n=18+(Math.random()*7|0);
 for(let i=0;i<n;i++){let a=i/n*6.283+rnd(-.12,.12),r=0;const len=L*rnd(.3,1),pts=[[0,0]];while(r<len){r+=rnd(12,40);a+=rnd(-.1,.1);pts.push([Math.cos(a)*r,Math.sin(a)*r,r])}rays.push(pts)}
 const rings=[.04,.09,.17,.3].map(f=>{const r=L*f,m=8+(Math.random()*5|0);return{r:r,p:Array.from({length:m},(_,i)=>{const a=i/m*6.283+rnd(-.2,.2),q=r*rnd(.8,1.2);return[Math.cos(a)*q,Math.sin(a)*q]})}});
 const B=performance.now(),DUR=260,edge=getComputedStyle(document.documentElement).getPropertyValue('--edge')||'#8ff';
 (function f(){const p=Math.min(1,(performance.now()-B)/DUR),Lr=L*(1-(1-p)**3);
  cc.clearRect(0,0,w,h);cc.save();cc.translate(x,y);
  const g=cc.createRadialGradient(0,0,0,0,0,220);g.addColorStop(0,`rgba(255,255,255,${.75*(1-p)})`);g.addColorStop(1,'rgba(255,255,255,0)');cc.fillStyle=g;cc.fillRect(-220,-220,440,440);
  cc.strokeStyle='rgba(240,252,255,.92)';cc.shadowColor=edge;cc.shadowBlur=7;cc.lineWidth=1.2;cc.lineJoin='round';
  rays.forEach(pts=>{cc.beginPath();cc.moveTo(0,0);for(let i=1;i<pts.length&&pts[i][2]<=Lr;i++)cc.lineTo(pts[i][0],pts[i][1]);cc.stroke()});
  cc.lineWidth=.8;rings.forEach(o=>{if(o.r>Lr)return;cc.beginPath();o.p.forEach((q,i)=>i?cc.lineTo(q[0],q[1]):cc.moveTo(q[0],q[1]));cc.closePath();cc.stroke()});
  cc.restore();
  if(p<1)requestAnimationFrame(f);else done()})()}
let busy=false;
function transition(x,y,swap){
 if(busy)return;busy=true;
 if(reduced||!R){swap();busy=false;return}
 $('#stage').classList.add('out');
 cracks(x,y,()=>{
  shatter(x,y);swap();
  setTimeout(()=>{CR.style.opacity=0},40);
  onRest=()=>{busy=false};
  setTimeout(()=>{if(busy&&phase==='rest')busy=false},4000)})}

/* ================= MARKDOWN ================= */
const url=(p,s,sm)=>/^(https?:|data:)/.test(s)?s:`projects/${p.path}/${sm&&p.small?'images-small':'images'}/${encodeURI(s)}`;
const lnk=(p,u)=>/^(https?:|mailto:|#)/.test(u)?u:`projects/${p.path}/${encodeURI(u)}`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function inline(s,p){s=esc(s).replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,a,u)=>`<img src="${url(p,u)}" alt="${a}" loading="lazy">`)
 .replace(/\[([^\]]+)\]\(([^)\s]+)\)(\{button\})?/g,(_,t,u,b)=>`<a href="${lnk(p,u)}"${b?' class="btn"':''} target="_blank" rel="noopener">${t}</a>`);
 return s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>')}
function embed(u){let m;
 if(m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/))return `<iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 if(m=u.match(/vimeo\.com\/(\d+)/))return `<iframe src="https://player.vimeo.com/video/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
 if(/\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(u))return `<img src="${u}" loading="lazy" alt="">`;
 return `<p><a href="${u}" target="_blank" rel="noopener">${u}</a></p>`}
function md(t,p){let o='',list=null,code=false;const close=()=>{if(list){o+=`</${list}>`;list=null}};
 for(const raw of t.replace(/\r/g,'').split('\n')){const l=raw.trim();let m;
  if(l.startsWith('```')){close();code=!code;o+=code?'<pre><code>':'</code></pre>';continue}
  if(code){o+=esc(raw)+'\n';continue}if(!l){close();continue}
  if(m=l.match(/^(#{1,4})\s+(.*)/)){close();o+=`<h${m[1].length}>${inline(m[2],p)}</h${m[1].length}>`}
  else if(m=l.match(/^([-*]|\d+\.)\s+(.*)/)){const k=/\d/.test(m[1])?'ol':'ul';if(list!==k){close();o+=`<${k}>`;list=k}o+=`<li>${inline(m[2],p)}</li>`}
  else if(/^https?:\/\/\S+$/.test(l)){close();o+=embed(l)}else{close();o+=`<p>${inline(l,p)}</p>`}}
 close();return o}

/* ================= NAVIGATION ================= */
const count=n=>n.projects.length+Object.values(n.kids).reduce((a,k)=>a+count(k),0);
const firstCover=n=>{for(const p of n.projects)if(p.cover)return p;for(const k of Object.values(n.kids)){const c=firstCover(k);if(c)return c}};
let stack=[],page=null,baseCover=null;
const stage=$('#stage');
function poly(){const j=(a,b)=>rnd(a,b).toFixed(1)+'%';
 return `polygon(${j(0,10)} ${j(0,12)},${j(42,58)} ${j(0,5)},${j(90,100)} ${j(0,12)},${j(95,100)} ${j(40,60)},${j(88,100)} ${j(88,100)},${j(42,58)} ${j(95,100)},${j(0,10)} ${j(88,100)},${j(0,5)} ${j(40,60)})`}
let items=[];
function showMenu(node){
 page=null;stage.classList.remove('page');
 items=[...Object.values(node.kids).map(k=>({label:pretty(k.name),sub:count(k)+(count(k)>1?' projects':' project'),node:k,pr:firstCover(k)})),
  ...node.projects.map(p=>({label:p.name,sub:'',p,pr:p.cover?p:null}))];
 const big=items.length<=4;
 stage.innerHTML=`<div id="menu">${items.map((it,i)=>`<button class="it ${big?'big':'sm'}" data-i="${i}"><span class="in" style="clip-path:${poly()};${it.pr?`--th:url('${it.pr.cover}')`:''}"><b>${esc(it.label)}</b>${it.sub?`<i>${it.sub}</i>`:''}</span></button>`).join('')}</div>`;
 baseCover=(firstCover(node)||{}).coverFull||null;setCover(baseCover);
 $('#hint').style.display='';crumb()}
function showPage(p){
 page=p;stage.classList.add('page');
 stage.innerHTML=`<div class="wrap">${md(p.md,p)}</div>`;stage.scrollTop=0;
 baseCover=p.coverFull||null;setCover(baseCover);$('#hint').style.display='none';crumb()}
function crumb(){$('#back').classList.toggle('on',!!page||stack.length>1)}
function centre(e,el){if(e&&e.detail>0&&e.clientX!==undefined)return[e.clientX,e.clientY];const r=el.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2]}
stage.addEventListener('click',e=>{const b=e.target.closest('.it');if(!b||busy)return;const it=items[+b.dataset.i],[x,y]=centre(e,b);
 transition(x,y,()=>{stage.classList.remove('out');if(it.node){stack.push(it.node);showMenu(it.node)}else showPage(it.p)})});
stage.addEventListener('pointerover',e=>{const b=e.target.closest('.it');if(!b||page||busy)return;const it=items[+b.dataset.i];if(it.pr)setCover(it.pr.coverFull)});
stage.addEventListener('pointerout',e=>{if(page||busy)return;const b=e.target.closest('.it');if(b&&!b.contains(e.relatedTarget))setCover(baseCover)});
function back(e){if(busy)return;const bk=$('#back'),[x,y]=e&&e.clientX!==undefined&&e.detail>0?[e.clientX,e.clientY]:[innerWidth-60,36];
 if(!page&&stack.length<=1)return;
 transition(x,y,()=>{stage.classList.remove('out');if(page){showMenu(stack[stack.length-1])}else{stack.pop();showMenu(stack[stack.length-1])}})}
$('#back').onclick=back;addEventListener('keydown',e=>{if(e.key==='Escape')back()});

Promise.all([fetch('projects.json').then(r=>r.json()).catch(()=>[]),fetch('site.md').then(r=>r.ok?r.text():'').catch(()=>'')]).then(([list,site])=>{
 const nm=(site.match(/^#\s+(.+)/m)||[])[1]||'',tg=(site.split('\n').find(l=>l.trim()&&!l.startsWith('#'))||'').trim();
 $('#name').textContent=nm;$('#tag').textContent=tg;if(nm)document.title=nm;
 const root={name:'',kids:{},projects:[]};
 list.forEach(p=>{const m=p.md.match(/!\[[^\]]*\]\(([^)\s]+)\)/)||p.md.match(/^(https?:\/\/\S+\.(?:png|jpe?g|webp|gif))\s*$/m);
  p.cover=m?url(p,m[1],true):null;p.coverFull=m?url(p,m[1],false):null;
  let n=root;p.parts.forEach(s=>{n=n.kids[s]??={name:s,kids:{},projects:[]}});n.projects.push(p)});
 initGL();
 if(!list.length){stage.innerHTML='<div id="empty" style="display:block">No projects found.<br>Run build.py, then reload.</div>';return}
 stack=[root];showMenu(root);setCover(baseCover,true)});
</script></body></html>
